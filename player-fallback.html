<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Player unavailable</title>
<style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{display:grid;min-height:100vh;margin:0;place-items:center;color:#fffaf0;background:#071f1c}main{width:min(92%,430px);padding:28px;text-align:center;background:#0c352f;border:1px solid #d6a94f;border-radius:18px}h1{margin:0 0 8px;font:700 1.65rem/1.1 Georgia,serif}p{margin:0 0 18px;color:#ecd59e;line-height:1.55}button{padding:10px 16px;color:#fffaf0;background:#c94d68;border:0;border-radius:999px;cursor:pointer;font-weight:800}button:hover{background:#a93653}</style></head>
<body><main><h1>This source needs a switch</h1><p>The current server could not load this title. Choose another source to keep watching.</p><button type="button" id="notify">Show server options</button></main><script>const notify=()=>window.parent.postMessage({type:'STREAMBOX_PLAYER_ERROR'},location.origin);document.getElementById('notify').addEventListener('click',notify);notify();</script></body></html>
